name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/travel-poster

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: lowercase image name
        run: echo "IMG=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: docker build -t $IMG:latest-${{ matrix.arch }} .
      - name: smoke test
        shell: bash
        run: |
          set +e
          out=$(docker run -d --name t -p 8090:8090 $IMG:latest-${{ matrix.arch }} 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error::docker run 失败($rc): $out"; exit 1; fi
          ok=0
          for i in $(seq 1 40); do curl -sf localhost:8090/api/status >/dev/null && ok=1 && break; sleep 2; done
          logs=$(docker logs t 2>&1 | tail -25 | tr '\n' ' ')
          state=$(docker inspect -f '{{.State.Status}} exit={{.State.ExitCode}}' t)
          if [ $ok -ne 1 ]; then echo "::error::服务没起来 [$state] $logs"; exit 1; fi
          chk=$(docker exec t python -c "import render, analyze, poster; print('ok')" 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error::导入失败: $chk"; exit 1; fi
          chk=$(docker exec t sh -c 'exiftool -ver && fc-list :lang=zh | head -1' 2>&1); rc=$?
          if [ $rc -ne 0 ]; then echo "::error::依赖缺失: $chk"; exit 1; fi
          echo "::notice::smoke ok [$state] $chk"
          docker rm -f t
      - name: push
        run: docker push $IMG:latest-${{ matrix.arch }}
      - name: export tar for offline import
        run: |
          docker tag $IMG:latest-${{ matrix.arch }} travel-poster:latest
          docker save travel-poster:latest -o travel-poster-${{ matrix.arch }}.tar
          ls -lh travel-poster-${{ matrix.arch }}.tar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          prerelease: false
          files: travel-poster-${{ matrix.arch }}.tar
          body: |
            绿联 DH 系列（DH2300 / DH4300 Plus，ARM 芯片）下载 **travel-poster-arm64.tar**；
            DXP 系列（Intel 芯片）下载 **travel-poster-amd64.tar**。
            使用说明见仓库首页 README。

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: multi-arch latest
        run: |
          IMG=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create -t $IMG:latest $IMG:latest-amd64 $IMG:latest-arm64
