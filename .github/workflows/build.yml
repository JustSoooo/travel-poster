name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/travel-poster

jobs:
  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: lowercase image name
        run: echo "IMG=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: docker build -t $IMG:latest-${{ matrix.arch }} .
      - name: smoke test
        run: |
          docker run -d --name t -p 8090:8090 $IMG:latest-${{ matrix.arch }}
          for i in $(seq 1 30); do curl -sf localhost:8090/api/status && break; sleep 2; done
          docker exec t python -c "import render, analyze, poster; print('ok')"
          docker exec t sh -c 'exiftool -ver && fc-list :lang=zh | head -1'
          docker rm -f t
      - name: push
        run: docker push $IMG:latest-${{ matrix.arch }}
      - name: export tar for offline import
        run: |
          docker tag $IMG:latest-${{ matrix.arch }} travel-poster:latest
          docker save travel-poster:latest -o travel-poster-${{ matrix.arch }}.tar
          ls -lh travel-poster-${{ matrix.arch }}.tar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新版
          prerelease: false
          files: travel-poster-${{ matrix.arch }}.tar
          body: |
            绿联 DH 系列（DH2300 / DH4300 Plus，ARM 芯片）下载 **travel-poster-arm64.tar**；
            DXP 系列（Intel 芯片）下载 **travel-poster-amd64.tar**。
            使用说明见仓库首页 README。

  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: multi-arch latest
        run: |
          IMG=$(echo $IMAGE | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create -t $IMG:latest $IMG:latest-amd64 $IMG:latest-arm64
