# 绿联 UGOS Pro：Docker → 项目 → 创建
#   存放路径：在你的「照片」文件夹里新建一个 travel-poster 文件夹，选它
#   Compose 配置：把这段原样粘贴进去，一个字都不用改
services:
  travel-poster:
    image: travel-poster:latest
    container_name: travel-poster
    ports:
      - "8090:8090"
    volumes:
      - ..:/photos:ro        # 上一级 = 你的照片文件夹（只读，工具不会改动任何照片）
      - ./data:/data         # 扫描结果和海报存在 travel-poster/data 里
    restart: unless-stopped
